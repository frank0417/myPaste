<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paste — 剪贴板管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1b2a2f;
      --muted: #5b6b70;
      --accent: #0f766e;
      --accent-soft: rgba(15, 118, 110, 0.14);
      --coral: #e07a5f;
      --panel: rgba(255, 252, 247, 0.78);
      --line: rgba(27, 42, 47, 0.08);
      --bg1: #f7f4ee;
      --bg2: #e7f0ef;
      --bg3: #f0ebe3;
      --shadow: 0 24px 60px rgba(27, 42, 47, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Sora", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1000px 500px at 10% -10%, #d9ece8 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #f3e2d4 0%, transparent 50%),
        linear-gradient(145deg, var(--bg1), var(--bg2) 45%, var(--bg3));
    }
    .stage {
      max-width: 1180px;
      margin: 0 auto;
      padding: 36px 24px 64px;
    }
    .brand-hero {
      display: grid;
      gap: 10px;
      margin-bottom: 28px;
      animation: rise 0.7s ease both;
    }
    .brand-hero h1 {
      margin: 0;
      font-family: "Fraunces", serif;
      font-size: clamp(2.6rem, 5vw, 4rem);
      letter-spacing: -0.03em;
      line-height: 0.95;
    }
    .brand-hero h1 span { color: var(--accent); }
    .brand-hero p {
      margin: 0;
      max-width: 34rem;
      color: var(--muted);
      font-size: 1.05rem;
    }
    .cta-row { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
    .lang-switch {
      display: inline-flex;
      gap: 4px;
      margin-left: auto;
      padding: 3px;
      background: rgba(255,255,255,.55);
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    .lang-switch button {
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 9px;
      cursor: pointer;
    }
    .lang-switch button.active {
      background: #fff;
      color: var(--ink);
      box-shadow: 0 1px 4px rgba(15,23,42,.08);
    }
    .btn {
      border: 0;
      border-radius: 12px;
      padding: 11px 16px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary {
      background: var(--accent);
      color: white;
      box-shadow: 0 10px 24px rgba(15, 118, 110, 0.28);
    }
    .btn-ghost {
      background: rgba(255,255,255,0.55);
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .window {
      display: grid;
      grid-template-columns: 190px 1fr 320px;
      min-height: 580px;
      border-radius: 20px;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.7);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      animation: rise 0.8s ease 0.08s both;
    }
    .sidebar, .history, .preview {
      padding: 18px 14px;
    }
    .sidebar {
      background: rgba(255,255,255,0.35);
      border-right: 1px solid var(--line);
    }
    .preview {
      background: rgba(27, 42, 47, 0.025);
      border-left: 1px solid var(--line);
    }
    .side-title {
      font-family: "Fraunces", serif;
      font-size: 1.45rem;
      margin: 4px 8px 18px;
    }
    .nav-label {
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 14px 8px 8px;
      font-weight: 600;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 0.92rem;
      padding: 9px 10px;
      border-radius: 10px;
      cursor: pointer;
      text-align: left;
    }
    .nav-item.active, .nav-item:hover {
      background: var(--accent-soft);
      color: var(--accent);
    }
    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
      padding: 0 6px;
    }
    .search {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.7);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
    }
    .search input {
      border: 0;
      outline: none;
      width: 100%;
      background: transparent;
      font: inherit;
      color: var(--ink);
    }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 6px 12px; }
    .chip {
      border: 0;
      background: rgba(27,42,47,0.05);
      color: var(--muted);
      border-radius: 8px;
      padding: 6px 10px;
      font: inherit;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
    }
    .chip.active {
      background: var(--accent-soft);
      color: var(--accent);
    }
    .list { display: grid; gap: 8px; padding: 0 6px 8px; max-height: 460px; overflow: auto; }
    .item {
      display: grid;
      grid-template-columns: 42px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: rgba(27,42,47,0.025);
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease, transform .15s ease;
      animation: itemIn .35s ease both;
    }
    .item:hover { background: rgba(27,42,47,0.045); transform: translateY(-1px); }
    .item.selected {
      background: var(--accent-soft);
      border-color: rgba(15, 118, 110, 0.35);
    }
    .badge {
      width: 42px; height: 42px; border-radius: 10px;
      display: grid; place-items: center;
      font-size: 0.72rem; font-weight: 700;
      color: white;
    }
    .meta { min-width: 0; }
    .meta strong {
      display: block;
      font-size: 0.92rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .meta small {
      color: var(--muted);
      font-size: 0.75rem;
    }
    .time { color: #8a979b; font-size: 0.7rem; }
    .type-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .preview h2 {
      margin: 0 0 12px;
      font-size: 1.25rem;
      line-height: 1.3;
    }
    .preview-box {
      background: rgba(255,255,255,0.65);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      min-height: 140px;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.92rem;
      line-height: 1.5;
    }
    .preview-box.code {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.84rem;
      background: #1b2a2f;
      color: #e7f0ef;
    }
    .color-swatch {
      height: 120px;
      border-radius: 16px;
      display: flex;
      align-items: flex-end;
      padding: 14px;
      color: white;
      font-family: "IBM Plex Mono", monospace;
      font-weight: 500;
      text-shadow: 0 1px 2px rgba(0,0,0,.35);
      margin-bottom: 14px;
    }
    .facts { margin: 16px 0; display: grid; gap: 8px; font-size: 0.86rem; }
    .facts div { display: grid; grid-template-columns: 72px 1fr; gap: 8px; }
    .facts span { color: var(--muted); }
    .actions { display: flex; gap: 8px; }
    .sync {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.7);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 0 rgba(15,118,110,.5);
      animation: pulse 1.8s ease infinite;
    }
    .menubar {
      margin-top: 22px;
      width: min(420px, 100%);
      border-radius: 16px;
      overflow: hidden;
      background: rgba(255,252,247,0.9);
      border: 1px solid rgba(255,255,255,0.8);
      box-shadow: var(--shadow);
      animation: rise 0.85s ease 0.16s both;
    }
    .menubar-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }
    .menubar-head strong {
      font-family: "Fraunces", serif;
      font-size: 1.15rem;
    }
    .menubar .list { max-height: 280px; padding: 10px; }
    .footnote {
      margin-top: 22px;
      color: var(--muted);
      font-size: 0.86rem;
      animation: rise 0.9s ease 0.2s both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes itemIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(15,118,110,.45); }
      70% { box-shadow: 0 0 0 8px rgba(15,118,110,0); }
      100% { box-shadow: 0 0 0 0 rgba(15,118,110,0); }
    }
    @media (max-width: 960px) {
      .window { grid-template-columns: 1fr; }
      .sidebar, .preview { border: 0; }
      .preview { border-top: 1px solid var(--line); }
    }

    .shot-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 80;
      cursor: crosshair;
      user-select: none;
      overflow: hidden;
    }
    .shot-overlay.active { display: block; background: rgba(0,0,0,.45); }
    .shot-overlay canvas.shot-draw {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .shot-dim {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.55);
      pointer-events: none;
    }
    .shot-selection {
      position: absolute;
      border: 1.5px solid #2f80ff;
      box-shadow: 0 0 0 9999px rgba(0,0,0,.55);
      pointer-events: none;
      display: none;
    }
    .shot-selection .handle {
      position: absolute;
      width: 8px;
      height: 8px;
      background: #2f80ff;
      border: 1.5px solid #fff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    .shot-selection .handle.nw { left: 0; top: 0; }
    .shot-selection .handle.n { left: 50%; top: 0; }
    .shot-selection .handle.ne { left: 100%; top: 0; }
    .shot-selection .handle.e { left: 100%; top: 50%; }
    .shot-selection .handle.se { left: 100%; top: 100%; }
    .shot-selection .handle.s { left: 50%; top: 100%; }
    .shot-selection .handle.sw { left: 0; top: 100%; }
    .shot-selection .handle.w { left: 0; top: 50%; }
    .shot-badge {
      position: absolute;
      transform: translateY(calc(-100% - 6px));
      background: rgba(0,0,0,.72);
      color: #fff;
      font-size: 11px;
      font-weight: 500;
      line-height: 22px;
      padding: 0 8px;
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: none;
    }
    .shot-toolbar {
      position: absolute;
      display: none;
      align-items: center;
      gap: 2px;
      box-sizing: border-box;
      height: 76px;
      padding: 28px 10px 0;
      background: transparent;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      z-index: 2;
      cursor: default;
      overflow: visible;
    }
    .shot-toolbar::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 48px;
      background: rgba(255,255,255,.94);
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(0,0,0,.18);
      pointer-events: none;
    }
    .shot-toolbar > *:not(.shot-palette):not(.shot-widths) {
      position: relative;
      z-index: 1;
    }
    .shot-toolbar [data-tip] {
      position: relative;
      z-index: 1;
    }
    .shot-toolbar [data-tip]::after {
      content: attr(data-tip);
      position: absolute;
      left: 50%;
      bottom: calc(100% + 14px);
      transform: translateX(-50%);
      background: rgba(0,0,0,.78);
      color: #fff;
      font-size: 11px;
      font-weight: 500;
      line-height: 22px;
      padding: 0 8px;
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      z-index: 4;
    }
    .shot-toolbar [data-tip]:hover::after {
      opacity: 1;
    }
    .shot-toolbar button {
      width: 32px;
      height: 32px;
      border: 0;
      background: transparent;
      border-radius: 8px;
      color: #334155;
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 0;
    }
    .shot-toolbar button:hover { background: rgba(15,23,42,.06); }
    .shot-toolbar button.active { background: #2f80ff; color: #fff; }
    .shot-toolbar button.ok { color: #52c41a; }
    .shot-toolbar button.cancel { color: #f5222d; }
    .shot-toolbar .grip {
      width: 22px;
      height: 32px;
      line-height: 32px;
      color: #94a3b8;
      letter-spacing: -1px;
      font-size: 11px;
      text-align: center;
      cursor: grab;
    }
    .shot-toolbar .divider {
      width: 1px;
      height: 18px;
      background: rgba(15,23,42,.1);
      margin: 0 4px;
    }
    .shot-toolbar .swatch {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,.2);
    }
    .shot-palette, .shot-widths {
      display: none;
      position: absolute;
      left: 50%;
      bottom: 56px;
      transform: translateX(-50%);
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,.16);
      padding: 8px 10px;
      gap: 8px;
    }
    .shot-palette.open, .shot-widths.open { display: flex; }
    .shot-palette button {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,.15);
    }
    .shot-toast {
      display: none;
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 90;
      background: rgba(244,246,248,.94);
      border-radius: 16px;
      padding: 10px 16px;
      box-shadow: 0 12px 32px rgba(0,0,0,.18);
      font-size: 13px;
      font-weight: 600;
    }
    .shot-toast.show { display: block; }
  </style>
</head>
<body>
  <div class="stage">
    <header class="brand-hero">
      <h1>Paste<span>.</span></h1>
      <p>保存、搜索、同步你复制的一切。文本、链接、图片、颜色与代码片段，一键回到指尖。</p>
      <div class="cta-row">
        <button class="btn btn-primary" id="simulateCopy">模拟复制一条</button>
        <button class="btn btn-ghost" id="simulateShot">模拟截图</button>
        <button class="btn btn-ghost" id="clearSearch">清空搜索</button>
        <div class="lang-switch" role="radiogroup" aria-label="Screenshot toolbar language">
          <button type="button" class="active" data-lang="zh-Hans" aria-pressed="true">简体</button>
          <button type="button" data-lang="zh-Hant" aria-pressed="false">繁體</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </header>

    <section class="window" aria-label="Paste 主窗口">
      <aside class="sidebar">
        <div class="side-title">Paste</div>
        <div class="nav-label">资料库</div>
        <button class="nav-item active" data-filter="all">全部</button>
        <button class="nav-item" data-filter="text">文本</button>
        <button class="nav-item" data-filter="link">链接</button>
        <button class="nav-item" data-filter="image">图片</button>
        <button class="nav-item" data-filter="code">代码</button>
        <button class="nav-item" data-filter="pinned">置顶</button>
        <div class="nav-label">看板</div>
        <button class="nav-item">工作</button>
        <button class="nav-item">灵感</button>
        <button class="nav-item">代码片段</button>
      </aside>

      <main class="history">
        <div class="toolbar">
          <label class="search">
            <span aria-hidden="true">⌕</span>
            <input id="search" placeholder="搜索已复制的一切…" />
          </label>
          <div class="sync"><span class="dot"></span> 已同步 · 刚刚</div>
        </div>
        <div class="chips" id="chips"></div>
        <div class="list" id="list"></div>
      </main>

      <aside class="preview" id="preview"></aside>
    </section>

    <section class="menubar" aria-label="菜单栏面板">
      <div class="menubar-head">
        <strong>Paste</strong>
        <span style="color:var(--muted);font-size:.78rem">⇧⌘V</span>
      </div>
      <div class="list" id="miniList"></div>
    </section>

    <p class="footnote">支持全局快捷键 ⇧⌘V、区域截图标注（矩形 / 箭头 / 马赛克 / 文字）、看板分类与 JSON 导出。这是 Mac 原生 SwiftUI 应用的交互预览。完整工程位于 <code>Paste/Paste.xcodeproj</code>，可在 macOS 14+ 用 Xcode 打开并提交 App Store。</p>
  </div>

  <div class="shot-overlay" id="shotOverlay" aria-label="截图标注">
    <canvas class="shot-draw" id="shotCanvas"></canvas>
    <div class="shot-selection" id="shotSelection">
      <div class="shot-badge" id="shotBadge">0 × 0</div>
      <span class="handle nw"></span><span class="handle n"></span><span class="handle ne"></span>
      <span class="handle w"></span><span class="handle e"></span>
      <span class="handle sw"></span><span class="handle s"></span><span class="handle se"></span>
    </div>
    <div class="shot-toolbar" id="shotToolbar">
      <div class="grip" data-tip-key="drag" data-tip="拖动工具条" aria-label="拖动工具条">⋮⋮</div>
      <button data-tool="rect" data-tip-key="rect" data-tip="矩形" aria-label="矩形">▢</button>
      <button data-tool="ellipse" data-tip-key="ellipse" data-tip="圆形" aria-label="圆形">○</button>
      <button data-tool="line" data-tip-key="line" data-tip="直线" aria-label="直线">╱</button>
      <button data-tool="arrow" data-tip-key="arrow" data-tip="箭头" aria-label="箭头">↗</button>
      <button data-tool="pen" data-tip-key="pen" data-tip="画笔" aria-label="画笔">✎</button>
      <button data-tool="text" data-tip-key="text" data-tip="文字" aria-label="文字">T</button>
      <button data-tool="pin" data-tip-key="pin" data-tip="序号" aria-label="序号">#</button>
      <button data-tool="mosaic" data-tip-key="mosaic" data-tip="马赛克" aria-label="马赛克">▦</button>
      <button data-tool="crop" data-tip-key="crop" data-tip="重新选区" aria-label="重新选区">✂</button>
      <div class="divider"></div>
      <button id="shotColor" data-tip-key="color" data-tip="颜色" aria-label="颜色"><span class="swatch" id="shotSwatch"></span></button>
      <button id="shotWidth" data-tip-key="width" data-tip="粗细" aria-label="粗细">≡</button>
      <div class="divider"></div>
      <button id="shotUndo" data-tip-key="undo" data-tip="撤销" aria-label="撤销">↺</button>
      <button id="shotDownload" data-tip-key="download" data-tip="下载截图" aria-label="下载截图">⇩</button>
      <div class="divider"></div>
      <button class="cancel" id="shotCancel" data-tip-key="cancel" data-tip="取消（Esc）" aria-label="取消（Esc）">✕</button>
      <button class="ok" id="shotConfirm" data-tip-key="confirm" data-tip="完成（Enter）" aria-label="完成（Enter）">✓</button>
      <div class="shot-palette" id="shotPalette"></div>
      <div class="shot-widths" id="shotWidths"></div>
    </div>
  </div>
  <div class="shot-toast" id="shotToast">截图 960 × 455 · 图片已复制</div>

  <script>
    const TYPE_COLOR = {
      text: "#3D5A80",
      link: "#0D9488",
      image: "#7C3AED",
      code: "#059669",
      color: "#F59E0B",
      snippet: "#2563EB",
      file: "#64748B"
    };
    const TYPE_LABEL = {
      text: "文本", link: "链接", image: "图片", code: "代码",
      color: "颜色", snippet: "片段", file: "文件"
    };
    const SHOT_HINTS = {
      "zh-Hans": {
        drag: "拖动工具条", rect: "矩形", ellipse: "圆形", line: "直线", arrow: "箭头",

    function matchScreenshotLanguage(tag) {
      const parts = String(tag || "").replace(/_/g, "-").split("-").map((p) => p.toLowerCase());
      const first = parts[0];
      if (first === "zh") {
        const rest = parts.slice(1).join("-");
        if (rest.startsWith("hant") || rest.startsWith("tw") || rest.startsWith("hk") || rest.startsWith("mo")) {
          return "zh-Hant";
        }
        return "zh-Hans";
      }
      if (first === "en") return "en";
      return null;
    }

    function resolveScreenshotLanguage(preferred) {
      for (const tag of preferred) {
        const match = matchScreenshotLanguage(tag);
        if (match) return match;
      }
      return "zh-Hans";
    }

    function applyShotHints(lang) {

    function layoutShot() {
      if (!shot.rect) {
        shot.selectionEl.style.display = "none";
        shot.toolbar.style.display = "none";
        shot.overlay.style.background = "";
        return;
      }
      shot.overlay.style.background = "transparent";
      const { x, y, w, h } = shot.rect;
      shot.selectionEl.style.display = "block";
      shot.selectionEl.style.left = `${x}px`;
      shot.selectionEl.style.top = `${y}px`;
      shot.selectionEl.style.width = `${w}px`;
      shot.selectionEl.style.height = `${h}px`;
      shot.badge.textContent = `${Math.round(w)} × ${Math.round(h)}`;
      const tb = shot.toolbar;
      tb.style.display = "flex";
      const tw = tb.offsetWidth || 638;
      const th = 48;
      const hint = 28;
      let tx = x + w / 2 - tw / 2;
      let ty = y + h + 12;
      if (ty + th > window.innerHeight - 8) ty = y - th - 12;
      ty -= hint;
      tx = Math.min(Math.max(tx, 8), Math.max(8, window.innerWidth - tw - 8));
      ty = Math.min(Math.max(ty, 8), Math.max(8, window.innerHeight - th - hint - 8));
      tb.style.left = `${tx}px`;
      tb.style.top = `${ty}px`;
      drawStrokes();
    }

    function drawStrokes() {
      const ctx = shot.ctx;
      if (!ctx) return;
      ctx.clearRect(0, 0, shot.canvas.width, shot.canvas.height);
      const all = shot.current ? shot.strokes.concat(shot.current) : shot.strokes;
      for (const s of all) {
        ctx.strokeStyle = s.color;
        ctx.fillStyle = s.color;
        ctx.lineWidth = s.width;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        const a = s.points[0];
        const b = s.points[s.points.length - 1];
        if (s.tool === "rect") {
          ctx.strokeRect(Math.min(a.x, b.x), Math.min(a.y, b.y), Math.abs(b.x - a.x), Math.abs(b.y - a.y));
        } else if (s.tool === "ellipse") {
          ctx.beginPath();
          ctx.ellipse((a.x + b.x) / 2, (a.y + b.y) / 2, Math.abs(b.x - a.x) / 2, Math.abs(b.y - a.y) / 2, 0, 0, Math.PI * 2);
          ctx.stroke();
        } else if (s.tool === "line" || s.tool === "pen") {
          ctx.beginPath();
          ctx.moveTo(s.points[0].x, s.points[0].y);
          s.points.slice(1).forEach((p) => ctx.lineTo(p.x, p.y));
          ctx.stroke();
        } else if (s.tool === "arrow") {
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
          const ang = Math.atan2(b.y - a.y, b.x - a.x);
          ctx.beginPath();
          ctx.moveTo(b.x, b.y);
          ctx.lineTo(b.x - 14 * Math.cos(ang - Math.PI / 6), b.y - 14 * Math.sin(ang - Math.PI / 6));
          ctx.lineTo(b.x - 14 * Math.cos(ang + Math.PI / 6), b.y - 14 * Math.sin(ang + Math.PI / 6));
          ctx.closePath();
          ctx.fill();
        } else if (s.tool === "mosaic") {
          const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
          const w = Math.abs(b.x - a.x), h = Math.abs(b.y - a.y);
          ctx.fillStyle = "rgba(120,130,140,.55)";
          for (let yy = y; yy < y + h; yy += 10) {
            for (let xx = x; xx < x + w; xx += 10) {
              ctx.globalAlpha = 0.4 + ((xx + yy) % 20) / 40;
              ctx.fillRect(xx, yy, 10, 10);
            }
          }
          ctx.globalAlpha = 1;
        } else if (s.tool === "text") {
          ctx.font = "16px Sora, sans-serif";
          ctx.fillText(s.text || "", a.x, a.y + 16);
        } else if (s.tool === "pin") {
          ctx.beginPath();
          ctx.arc(a.x, a.y, 11, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#fff";
          ctx.font = "bold 11px Sora, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(String(s.pin), a.x, a.y);
          ctx.textAlign = "start";
          ctx.textBaseline = "alphabetic";
        }
      }
    }

    function hitHandle(pt) {
      if (!shot.rect) return null;
      const { x, y, w, h } = shot.rect;
      const spots = {
        nw: [x, y], n: [x + w / 2, y], ne: [x + w, y],
        e: [x + w, y + h / 2], se: [x + w, y + h],
        s: [x + w / 2, y + h], sw: [x, y + h], w: [x, y + h / 2]
      };
      for (const [name, [hx, hy]] of Object.entries(spots)) {
        if (Math.hypot(pt.x - hx, pt.y - hy) <= 10) return name;
      }
      if (pt.x >= x && pt.x <= x + w && pt.y >= y && pt.y <= y + h) return "move";
      return null;
    }

    shot.overlay.addEventListener("mousedown", (e) => {
      if (e.target.closest(".shot-toolbar")) return;
      const pt = { x: e.clientX, y: e.clientY };
      if (e.detail === 2 && shot.rect) {
        confirmShot();
        return;
      }
      const handle = hitHandle(pt);
      if (handle && handle !== "move") {
        shot.drag = { kind: "handle", handle, start: pt, origin: { ...shot.rect } };
        return;
      }
      if (handle === "move") {
        if (shot.tool === "crop") {
          shot.strokes = [];
          shot.drag = { kind: "new", start: pt };
          shot.rect = { x: pt.x, y: pt.y, w: 0, h: 0 };
          return;
        }
        if (shot.tool === "text") {
          const text = prompt("输入文字", "");
          if (text) shot.strokes.push({ tool: "text", color: shot.color, width: shot.width, points: [pt], text });
          drawStrokes();
          return;
        }
        if (shot.tool === "pin") {
          shot.strokes.push({ tool: "pin", color: shot.color, width: shot.width, points: [pt], pin: shot.pin++ });
          drawStrokes();
          return;
        }
        if (["rect", "ellipse", "line", "arrow", "pen", "mosaic"].includes(shot.tool)) {
          shot.current = { tool: shot.tool, color: shot.color, width: shot.width, points: [pt, pt] };
          shot.drag = { kind: "draw", start: pt };
          return;
        }
        shot.drag = { kind: "move", start: pt, origin: { ...shot.rect } };
        return;
      }
      shot.strokes = [];
      shot.tool = "move";
      setTool("move");
      shot.drag = { kind: "new", start: pt };
      shot.rect = { x: pt.x, y: pt.y, w: 0, h: 0 };
      layoutShot();
    });

    window.addEventListener("mousemove", (e) => {
      if (!shot.drag) return;
      const pt = { x: e.clientX, y: e.clientY };
      if (shot.drag.kind === "new") {
        shot.rect = {
          x: Math.min(shot.drag.start.x, pt.x),
          y: Math.min(shot.drag.start.y, pt.y),
          w: Math.abs(pt.x - shot.drag.start.x),
          h: Math.abs(pt.y - shot.drag.start.y)
        };
        layoutShot();
      } else if (shot.drag.kind === "move") {
        shot.rect = {
          x: Math.min(Math.max(0, shot.drag.origin.x + pt.x - shot.drag.start.x), window.innerWidth - shot.drag.origin.w),
          y: Math.min(Math.max(0, shot.drag.origin.y + pt.y - shot.drag.start.y), window.innerHeight - shot.drag.origin.h),
          w: shot.drag.origin.w,
          h: shot.drag.origin.h
        };
        layoutShot();
      } else if (shot.drag.kind === "handle") {
        const o = shot.drag.origin;
        let x1 = o.x, y1 = o.y, x2 = o.x + o.w, y2 = o.y + o.h;
        const h = shot.drag.handle;
        if (h.includes("n")) y1 = pt.y;
        if (h.includes("s")) y2 = pt.y;
        if (h.includes("w")) x1 = pt.x;
        if (h.includes("e")) x2 = pt.x;
        shot.rect = { x: Math.min(x1, x2), y: Math.min(y1, y2), w: Math.abs(x2 - x1), h: Math.abs(y2 - y1) };
        layoutShot();
      } else if (shot.drag.kind === "draw" && shot.current) {
        if (shot.current.tool === "pen") shot.current.points.push(pt);
        else shot.current.points[1] = pt;
        drawStrokes();
      }
    });

    window.addEventListener("mouseup", () => {
      if (!shot.drag) return;
      if (shot.drag.kind === "new" && shot.rect && (shot.rect.w < 4 || shot.rect.h < 4)) shot.rect = null;
      if (shot.drag.kind === "draw" && shot.current) {
        shot.strokes.push(shot.current);
        shot.current = null;
      }
      shot.drag = null;
      layoutShot();
    });

    window.addEventListener("keydown", (e) => {
      if (!shot.overlay.classList.contains("active")) return;
      if (e.key === "Escape") closeShot();
      if (e.key === "Enter") confirmShot();
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z") {
        shot.strokes.pop();
        drawStrokes();
      }
    });

    renderChips();
    renderList();
  </script>
</body>
</html>
